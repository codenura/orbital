name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Set up vcpkg binary caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ matrix.c_compiler }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      - name: Configure vcpkg binary cache environment
        run: |
          mkdir -p ~/.cache/vcpkg/archives
          echo "VCPKG_DEFAULT_BINARY_CACHE=${HOME}/.cache/vcpkg/archives" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV

      - name: Preload and Verify libuuid Archive
        shell: bash
        run: |
          LIBUUID_ARCHIVE="$VCPKG_ROOT/downloads/libuuid-1.0.3.tar.gz"
          EXPECTED_SHA512="77488caccc66503f6f2ded7bdfc4d3bc2c20b24a8dc95b2051633c695e99ec27876ffbafe38269b939826e1fdb06eea328f07b796c9e0aaca12331a787175507"

          if [ ! -f "$LIBUUID_ARCHIVE" ]; then
              mkdir -p "$VCPKG_ROOT/downloads"
              curl -fL --retry 3 --retry-all-errors --max-time 120 \
                  "https://downloads.sourceforge.net/project/libuuid/libuuid-1.0.3.tar.gz" \
                  -o "$LIBUUID_ARCHIVE" || { echo "Failed to download the libuuid source archive."; rm -f "$LIBUUID_ARCHIVE"; exit 1; }

              ACTUAL_SHA512=$(sha512sum "$LIBUUID_ARCHIVE" | awk '{print $1}')
              if [ "$ACTUAL_SHA512" != "$EXPECTED_SHA512" ]; then
                  echo "The downloaded libuuid archive failed its SHA-512 check."
                  rm -f "$LIBUUID_ARCHIVE"
                  exit 1
              fi
          fi

      - name: Install Required Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y build-essential bison libxrender-dev libxft-dev python3-jinja2 libxi-dev libxtst-dev \
                                  autoconf autoconf-archive automake libtool zip unzip libxrandr-dev nasm gfortran \
                                  python3-full python3-venv libltdl-dev
          vcpkg install

      - name: Initialize The All Submodules Of This Repo
        run: |
          git submodule update --init --recursive --remote

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          --preset=default
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --verbose --build-config ${{ matrix.build_type }}