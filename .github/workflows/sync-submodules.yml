name: Sync The All Submodules

on:
  push:
    branches:
      - main

jobs:
  sync-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Required to push changes back to GitHub
          submodules: 'recursive'
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          # FIXED: Changed invalid email string to standard GitHub Actions bot format
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Changes in All Submodules
        run: |
          # Loop through every initialized submodule automatically
          git submodule foreach --recursive '
            echo "Processing submodule: $path"
            
            # Ensure we track the remote main branch
            git checkout main
            
            # Check if there are any local changes inside this submodule
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "[Improved] Automated submodule update from parent workflow."
              git push origin main
            else
              echo "No changes to commit in $path"
            fi
          '

      - name: Update Parent Repository Pointer
        run: |
          # If the submodules moved to new commits, the parent repo locks them in
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: update submodule reference pointers"
            git push origin main
          else
            echo "No submodule pointer updates needed for parent repository."
          fi